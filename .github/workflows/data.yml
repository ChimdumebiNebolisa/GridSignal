name: Data Validation

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run data:validate-scoring
